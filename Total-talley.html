<div class="hud-bar">
    <span>Path: <span style="color:#38bdf8;">Foster-Alum</span></span>
    <div style="display:flex; align-items:center; gap:15px;">
        <div>XP: <span id="hud-xp" style="color:#4ade80;">400</span></div>
        <div id="hud-tier" style="font-size:0.8rem; padding:3px 8px; background:rgba(255,255,255,0.1); border-radius:4px;">Tier 1</div>
    </div>
</div>

<script>
    // Update HUD elements on load using our tracker engine
    document.getElementById('hud-xp').innerText = AFTITracker.getXP();
    let tierInfo = AFTITracker.getReadineeTier ? AFTITracker.getReadinessTier() : { title: "Tier 1", color: "#f59e0b" };
    let tierEl = document.getElementById('hud-tier');
    tierEl.innerText = tierInfo.title;
    tierEl.style.color = tierInfo.color;
</script>
