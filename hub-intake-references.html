<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTI Verification & Yield Log</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
.card { background: #1e293b; padding: 18px; border-radius: 12px; max-width: 550px; margin: auto; border: 1px solid #334155; }
h2 { color: #10b981; font-size: 1.2rem; margin: 0 0 12px 0; }
.ref-box { background: #0f172a; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 12px; border-left: 4px solid #10b981; }
.input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
input[type="number"], input[type="text"] { width: 100%; padding: 8px; background: #334155; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; }
label { font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 4px; }
.btn { width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
.btn-back { display: block; text-align: center; color: #94a3b8; font-size: 0.85rem; text-decoration: none; padding-top: 10px; }
</style>
</head>
<body>
<div class="card">
<h2>⚖️ Institutional References & Yield Log</h2>
<div class="ref-box">
<b>🎓 Active OSU Extension Reference:</b><br>
<span style="color:#a7f3d0;">Status: VERIFIED</span> | Linn County Program Reference #AFTI-97
</div>
<form id="yieldForm">
<div class="input-grid">
<div>
<label>Crop Type</label>
<input type="text" id="cropType" placeholder="e.g. Oyster Mushrooms" required>
</div>
<div>
<label>Total Harvest Lbs</label>
<input type="number" id="totalLbs" placeholder="e.g. 150" required>
</div>
</div>
<button type="submit" class="btn">Log Harvest & Calculate Split</button>
</form>
<a href="shared-harvest-hub.html?v=5" class="btn-back">← Back to Mitigation Hub</a>
</div>
<script>
document.getElementById('yieldForm').addEventListener('submit', function(e) {
e.preventDefault();
let crop = document.getElementById('cropType').value;
let lbs = parseFloat(document.getElementById('totalLbs').value);
let landownerShare = (lbs * 0.3).toFixed(1);
let traineeShare = (lbs * 0.7).toFixed(1);
let xp = parseInt(localStorage.getItem('globalXP')) || 0;
localStorage.setItem('globalXP', xp + 10);
alert('Harvest Logged!\nCrop: ' + crop + '\nLandowner Share (30%): ' + landownerShare + ' lbs\nTrainee Share (70%): ' + traineeShare + ' lbs\n+10 XP Awarded!');
window.location.href = 'shared-harvest-hub.html?v=5';
});
</script>
</body>
</html>
