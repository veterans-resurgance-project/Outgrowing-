<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Student Profile</title>
<style>
body { font-family:system-ui, sans-serif; background:#0f172a; color:#fff; padding:15px; margin:0; }
.card { background:#1e293b; padding:18px; border-radius:12px; max-width:550px; margin:auto; border:1px solid #38bdf8; }
h2 { color:#38bdf8; font-size:1.2rem; margin:0 0 12px 0; }
.form-group { margin-bottom:12px; }
label { display:block; font-size:0.75rem; color:#94a3b8; margin-bottom:4px; font-weight:bold; }
input[type="text"], select { width:100%; padding:8px; background:#0f172a; border:1px solid #475569; color:#fff; border-radius:4px; box-sizing:border-box; }
.btn { width:100%; padding:12px; background:#10b981; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:0.9rem; margin-top:10px; }
.btn-back { display:block; text-align:center; color:#94a3b8; font-size:0.85rem; text-decoration:none; padding-top:12px; }
</style>
</head>
<body>
<div class="card">
<h2>📝 Apprentice Profile Registration</h2>
<form id="profileForm">
<div class="form-group">
<label>Apprentice Full Name</label>
<input type="text" id="appName" placeholder="Enter trainee name" required>
</div>
<div class="form-group">
<label>Active Core Program Track</label>
<select id="appTrack" required>
<option value="Foster-Alum Track">Foster-Alum Stabilization Track</option>
<option value="Standard Bootstrap Track">Standard Bootstrap Farm Track</option>
<option value="Wild Foraging Track">Wild Foraging &amp; Fungi Specialization</option>
<option value="Precision Agro-Specialist">Precision Nursery Specialist Track</option>
</select>
</div>
<button type="submit" class="btn">Lock Profile Parameters</button>
</form>
<a href="student-profile-hub.html?v=16" class="btn-back">← Cancel &amp; Return</a>
</div>
<script>
document.getElementById('profileForm').addEventListener('submit', function(e) {
e.preventDefault();
let name = document.getElementById('appName').value;
let track = document.getElementById('appTrack').value;
localStorage.setItem('studentName', name);
localStorage.setItem('studentTrack', track);
alert('Apprentice Profile Locked!\nName: ' + name + '\nTrack: ' + track);
window.location.href = 'student-profile-hub.html?v=16';
});
</script>
</body>
</html>
