<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTI - Stage 5: Market Delivery</title>
    <!-- CACHE-BUSTED UTILITY LINK -->
    <script src="afti-core.js?v=2"></script>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --txt:#f8fafc; --primary:#27ae60; --hud:#144d29; --accent:#38bdf8; --warn:#f59e0b; --danger:#ef4444; }
        body { font-family:system-ui, sans-serif; background:var(--bg); color:var(--txt); padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .container { width:100%; max-width:800px; background:var(--card); border-radius:14px; padding:35px; box-sizing:border-box; border:1px solid rgba(255,255,255,0.1); box-shadow:0 12px 32px rgba(0,0,0,0.5); }
        .hud-bar { background:var(--hud); border-radius:8px; padding:10px 18px; margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:0.9rem; }
        .choices-container { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
        .choice-btn { background:#0f172a; border:1px solid #334155; color:#f8fafc; padding:16px 20px; border-radius:8px; cursor:pointer; width:100%; text-align:left; display:flex; flex-direction:column; gap:5px; }
        .choice-btn:hover { border-color:var(--accent); background:rgba(56,189,248,0.05); }
        .feedback-box { margin-top:25px; padding:20px; border-radius:8px; display:none; line-height:1.6; border:1px solid rgba(255,255,255,0.2); }
        .nav-bridge { display:inline-block; margin-top:15px; background:var(--primary); color:#fff; padding:12px 24px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
        
 
      <script>
    document.addEventListener("DOMContentLoaded", () => {
        const track = localStorage.getItem('afti_track_name') || 'Not Selected';
        document.body.setAttribute('data-track', track);
    });

    function selectMarketOption(choiceType, points) {
        if (window.selectOption) { window.selectOption(choiceType, points); }
        document.getElementById('choices-wrapper').style.display = 'none';
        
        const vp = document.getElementById('feedback-viewport'); 
        const title = document.getElementById('feedback-title');
        const text = document.getElementById('feedback-text'); 
        const ac = document.getElementById('feedback-action-container'); 
        vp.style.display = 'block';
        
        // SAFE State Check: Determine if the player is specifically a Foster Alum
        const track = localStorage.getItem('afti_track_name') || 'Not Selected';
        const isFoster = (track === 'Foster-Alum');

        if (choiceType === 'A') {
            // Unveils the correct title block based on track validation
            vp.style.backgroundColor = 'rgba(39,174,96,0.1)'; 
            title.innerText = isFoster ? "Success (+100 XP / +$120 Stipend)" : "Success (+100 XP)"; 
            title.style.color = "#4ade80";
            
            text.innerText = "Your harvest checks clear beautifully! By tracking safety wash standard operating procedures, you avoid food waste, support community food access, and successfully close out your active learning contract.";
            
            // THE UNBROKEN BRIDGE: Pushes all tracks straight to the summary page natively
            ac.innerHTML = '<button onclick="window.location.href=\'simulation-portfolio-summary.html\'" class="nav-bridge" style="border:none; cursor:pointer;">Compile Your Final Verified Portfolio &rarr;</button>';
        } else if (choiceType === 'B') {
            vp.style.backgroundColor = 'rgba(245,158,11,0.1)'; title.innerText = "Misinformed Pivot (+25 XP)"; title.style.color = 'var(--warn)';
            text.innerText = "Bypassing food sorting standards results in rapid leaf bruising and mud contamination during transit. Half of your harvest is rejected at arrival due to local safety codes.";
            ac.innerHTML = '<button onclick="window.location.href=\'difficult-track-stage5-recovery-b.html\'" class="nav-bridge" style="background:var(--warn); border:none; cursor:pointer;">Enter Packaging Recovery Loop &rarr;</button>';
        } else {
            vp.style.backgroundColor = 'rgba(239,68,68,0.1)'; title.innerText = "Logistics Failure (+0 XP)"; title.style.color = 'var(--danger)';
            text.innerText = "Trapping heat and moisture inside a tight, hot room accelerates post-harvest mold. Your entire commercial batch rots overnight. This failure locks out your delivery performance score.";
            ac.innerHTML = '<button onclick="window.location.href=\'difficult-track-stage5-recovery-c.html\'" class="nav-bridge" style="background:var(--danger); border:none; cursor:pointer;">Enter Crop Safety Remediation Loop &rarr;</button>';
        }
    }
</script>
        
i
</body>
</html>
