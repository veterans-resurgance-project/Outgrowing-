<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTI Incubator Calculator</title>
<style>
body { font-family:system-ui, sans-serif; background:#0f172a; color:#fff; padding:15px; margin:0; }
.card { background:#1e293b; padding:18px; border-radius:12px; max-width:550px; margin:auto; border:1px solid #38bdf8; }
h2 { color:#38bdf8; font-size:1.2rem; margin:0 0 12px 0; }
.input-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
input[type="number"] { width:100%; padding:8px; background:#0f172a; border:1px solid #475569; color:#fff; border-radius:4px; box-sizing:border-box; }
label { font-size:0.75rem; color:#94a3b8; display:block; margin-bottom:4px; }
.btn { width:100%; padding:10px; background:#38bdf8; color:#0f172a; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:0.85rem; }
.btn-back { display:block; text-align:center; color:#94a3b8; font-size:0.85rem; text-decoration:none; padding-top:10px; }
</style>
</head>
<body>
<div class="card">
<h2>📊 Micro-Farm Capital Investment Calculator</h2>
<form id="calcForm">
<div class="input-grid">
<div><label>Startup Fund ($)</label><input type="number" id="fund" value="5000" required></div>
<div><label>Irrigation Supplies ($)</label><input type="number" id="irrig" placeholder="0" required></div>
<div><label>Seeds &amp; Soil Plugs ($)</label><input type="number" id="seeds" placeholder="0" required></div>
<div><label>Hand Tools ($)</label><input type="number" id="tools" placeholder="0" required></div>
</div>
<button type="submit" class="btn">Calculate Remaining Balance</button>
</form>
<a href="incubator-hub.html?v=9" class="btn-back">← Back to Incubator Hub</a>
</div>
<script>
document.getElementById('calcForm').addEventListener('submit', function(e) {
e.preventDefault();
let f = parseFloat(document.getElementById('fund').value) || 0;
let i = parseFloat(document.getElementById('irrig').value) || 0;
let s = parseFloat(document.getElementById('seeds').value) || 0;
let t = parseFloat(document.getElementById('tools').value) || 0;
let totalCost = i + s + t;
let remaining = f - totalCost;
localStorage.setItem('lastIncubatorBalance', remaining);
let xp = parseInt(localStorage.getItem('globalXP')) || 0;
localStorage.setItem('globalXP', xp + 15);
alert('Budget Saved!\nTotal Costs: $' + totalCost + '\nRemaining Balance: $' + remaining + '\n+15 Global XP Awarded.');
window.location.href = 'incubator-hub.html?v=9';
});
</script>
</body>
</html>
