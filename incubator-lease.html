<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTI Asset Reservation</title>
<style>
body { font-family:system-ui, sans-serif; background:#0f172a; color:#fff; padding:15px; margin:0; }
.card { background:#1e293b; padding:18px; border-radius:12px; max-width:550px; margin:auto; border:1px solid #38bdf8; }
h2 { color:#38bdf8; font-size:1.2rem; margin:0 0 12px 0; }
.form-group { margin-bottom:12px; }
label { display:block; font-size:0.75rem; color:#94a3b8; margin-bottom:4px; font-weight:bold; }
select, input[type="number"] { width:100%; padding:8px; background:#0f172a; border:1px solid #475569; color:#fff; border-radius:4px; box-sizing:border-box; }
.btn { width:100%; padding:12px; background:#38bdf8; color:#0f172a; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:0.9rem; margin-top:10px; }
.btn-back { display:block; text-align:center; color:#94a3b8; font-size:0.85rem; text-decoration:none; padding-top:12px; }
</style>
</head>
<body>
<div class="card">
<h2>🚜 Equipment Share &amp; Tool Lease Log</h2>
<form id="leaseForm">
<div class="form-group">
<label>Select Tool Asset Category</label>
<select id="toolAsset" required>
<option value="Walk-Behind Rototiller">BCS Walk-Behind Rototiller</option>
<option value="Propane Flame Weeder">Propane Flame Weeder Kit</option>
<option value="Cold-Room Wash Space">Cold-Room Packing Station Slot</option>
</select>
</div>
<div class="form-group">
<label>Requested Lease Duration (Hours)</label>
<input type="number" id="leaseHours" min="1" max="8" placeholder="Max 8 hours" required>
</div>
<button type="submit" class="btn">Confirm Asset Reservation</button>
</form>
<a href="incubator-hub.html?v=10" class="btn-back">← Back to Incubator Hub</a>
</div>
<script>
document.getElementById('leaseForm').addEventListener('submit', function(e) {
e.preventDefault();
let asset = document.getElementById('toolAsset').value;
let hours = document.getElementById('leaseHours').value;
localStorage.setItem('lastActiveLeaseAsset', asset);
localStorage.setItem('lastActiveLeaseHours', hours);
let xp = parseInt(localStorage.getItem('globalXP')) || 0;
localStorage.setItem('globalXP', xp + 15);
alert('Reservation Logged!\nAsset Allocated: ' + asset + '\nDuration: ' + hours + ' Hours.\n+15 Global XP Awarded.');
window.location.href = 'incubator-hub.html?v=10';
});
</script>
</body>
</html>
