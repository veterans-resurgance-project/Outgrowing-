<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTI Mapping & Water Infrastructure</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
.card { background: #1e293b; padding: 18px; border-radius: 12px; max-width: 550px; margin: auto; border: 1px solid #334155; }
h2 { color: #38bdf8; font-size: 1.2rem; margin: 0 0 12px 0; }
.log-box { background: #0f172a; padding: 12px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 12px; }
.input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
input[type="number"] { width: 100%; padding: 8px; background: #334155; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; }
label { font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 4px; }
.btn { width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
.btn-back { display: block; text-align: center; color: #94a3b8; font-size: 0.85rem; text-decoration: none; padding-top: 10px; }
</style>
</head>
<body>
<div class="card">
<h2>🗺️ Precision Mapping & Water Budget Log</h2>
<div class="log-box">
<b>📍 Boundary Allocation Parameters:</b>
<div style="margin:4px 0;">• Primary Footprint: Fixed 1/8-acre zone box mapping rules.</div>
<div>• Buffers: 25-foot minimum buffer zone from primary residence.</div>
</div>
<form id="waterForm">
<div class="input-grid">
<div>
<label>Active Row Feet</label>
<input type="number" id="rowFeet" placeholder="e.g. 500" required>
</div>
<div>
<label>GPH Per Drip Emitter</label>
<input type="number" id="gph" step="0.1" placeholder="e.g. 0.5" required>
</div>
</div>
<button type="submit" class="btn">Log Infrastructure & Save Plots</button>
</form>
<a href="shared-harvest-hub.html?v=4" class="btn-back">← Back to Mitigation Hub</a>
</div>
<script>
document.getElementById('waterForm').addEventListener('submit', function(e) {
e.preventDefault();
let rows = parseFloat(document.getElementById('rowFeet').value);
let flow = parseFloat(document.getElementById('gph').value);
let totalDailyGallons = Math.round(rows * flow * 0.5);
localStorage.setItem('lastWaterBudget', totalDailyGallons);
let xp = parseInt(localStorage.getItem('globalXP')) || 0;
localStorage.setItem('globalXP', xp + 10);
alert('Plot parameters saved! Calculated Daily Budget: ' + totalDailyGallons + ' Gallons. +10 XP Awarded.');
window.location.href = 'shared-harvest-hub.html?v=4';
});
</script>
</body>
</html>
